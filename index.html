function sameUnit(r){ return r && (r.unit===UNIT_ID); }
/* 只輸入名字、一關都還沒完成（也沒交卷）的人不算進排名：
   不然全班都是 0 分時，排在前面的人會平白拿到 3 點，也會亂播「被超過了」 */
/* 開始玩（按了「開始挑戰」）就上榜。試算表程式還是舊版、沒有「已開始」欄時，用「有用時」判斷 */
function rankable(r){ return r && ((r.done||0)>0 || !!r.fin || !!r.st || (r.secs||0)>0); }
/* 同一個名字只留一列：學校電腦重開機被還原、或學生換到別台電腦，都會產生新的 uid。
   留自己這台的那一列；都不是自己就留分數高的（同分留比較新的）。沒寫名字的不合併。 */
function dedupeByName(list){
  var keep={}, out=[];
  list.forEach(function(r){
    var k=String(r.name||'').trim();
    if(!k || k===UNIT.roleAnon){ out.push(r); return; }
    var o=keep[k];
    if(!o){ keep[k]=r; return; }
    var better = (r.uid===UID) ? true : (o.uid===UID) ? false
               : (r.gained!==o.gained ? r.gained>o.gained : (r.ts||0)>(o.ts||0));
    if(better) keep[k]=r;
  });
  for(var k in keep) out.push(keep[k]);
  return out;
}

/* 排行榜排序 ＝ 得分高的在前，同分則用時短的在前 */
function rankSort(a,b){
  if(b.gained!==a.gained) return b.gained-a.gained;
  if(a.secs!==b.secs) return a.secs-b.secs;
  /* 完全同分同時間：照名字排，才不會每次重抓名單就互換位置、亂播「衝上第一名」 */
  return String(a.name||'').localeCompare(String(b.name||''));
}

/* ---------- 點數改成看班上的相對名次 ----------
   前 1/3 → 3 點、中間 1/3 → 2 點、後 1/3 → 1 點。
   班上不到 3 人時沒有比較基準，改用絕對標準（曲線）估算。 */
var CLASS_LIST=[];
function classList(){
  var l=(CLASS_LIST&&CLASS_LIST.length)?CLASS_LIST:localBoard();
  var myName=String(S.name||'').trim();
  return dedupeByName(l.filter(function(x){
    if(!(x&&typeof x.gained==='number'&&sameUnit(x)&&rankable(x))) return false;
    /* 跟我同名、但不是這台電腦的舊紀錄：呼叫端會放進「現在的我」，舊的那列不要再算一次 */
    if(myName && x.uid!==UID && String(x.name||'').trim()===myName) return false;
    return true;
  }));
}
function refreshClass(cb){
  if(DB){
    try{
      DB.collection('scores').get().then(function(snap){
        CLASS_LIST=snap.docs.map(function(d){return d.data();})
                            .filter(function(x){return x&&typeof x.gained==='number';});
        if(cb) cb();
      }).catch(function(){ if(cb) cb(); });
      return;
    }catch(e){}
  }
  if(DBmode==='cloud'){
    cloudList(function(l){
      if(l) CLASS_LIST=l.filter(function(x){return x&&typeof x.gained==='number';});
      if(cb) cb();
    });
    return;
  }
  CLASS_LIST=localBoard();
  if(cb) cb();
}
function ptsByRank(idx,total){
  if(total<MIN_CLASS) return null;
  var pct = total>1 ? idx/(total-1) : 0;
  return pct<=1/3 ? 3 : (pct<=2/3 ? 2 : 1);
}
/* 把「現在的我」放進全班名單裡排一次 */
function myRankNow(me){
  var list=classList().filter(function(r){ return r.uid!==me.uid; }).concat([me]);
  list.sort(rankSort);
  var idx=0;
  for(var i=0;i<list.length;i++){ if(list[i].uid===me.uid){ idx=i; break; } }
  return { rank:idx+1, n:list.length, pts:(me.gained>0)?ptsByRank(idx,list.length):null };
}
/* 含「正在玩、還沒記錄的這一關」的暫定總成績 */
/* 跟排行榜同一套標準：得分高的比較好，同分比用時短 */
function betterRun(gained,sec,old){
  return gained>old.gained || (gained===old.gained && sec<old.sec);
}
function provisionalSummary(){
  var m=mySummary();
  if(G){
    var old=S.records[G.lv.id];
    /* 重玩：結算時只留比較好的那次，所以還沒超過舊紀錄前，分數維持舊紀錄，不會往下掉 */
    if(old && !betterRun(G.gained,G.sec,old)) return m;
    if(old){ m.gained-=old.gained; m.secs-=old.sec; }
    m.gained+=G.gained; m.secs+=G.sec;
    if(!old) m.done+=1;
  }
  return m;
}
/* ============================================================
   名次播報：偵測排行榜的名次變動，唸出來並在畫面上標記
   ============================================================ */
var RANK_SNAP=null, RANK_DELTA={}, VOICE=null, VOICE_READY=false, LAST_SAY=0, LAST_CHASE='';

function pickVoice(){
  if(VOICE_READY) return VOICE;
  try{
    var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
    if(!vs || !vs.length) return null;      /* 語音清單還沒載好，下次再試 */
    for(var i=0;i<vs.length;i++){
      if(/zh[-_]TW|cmn-Hant|Hanhan|Yating|Zhiwei/i.test(vs[i].lang+' '+vs[i].name)){ VOICE=vs[i]; break; }
    }
    if(!VOICE){
      for(var j=0;j<vs.length;j++){
        if(/^zh/i.test(vs[j].lang)){ VOICE=vs[j]; break; }
      }
    }
    VOICE_READY=true;
  }catch(e){}
  return VOICE;
}
try{
  if(window.speechSynthesis){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=function(){ VOICE_READY=false; pickVoice(); };
  }
}catch(e){}

/* 唸出一句話（跟音效共用同一個開關）
   queue=true 表示接在上一句後面唸，不要蓋掉它
   ------------------------------------------------------------------
   瀏覽器語音有兩個常見的坑，都在這裡處理掉：
   1. cancel() 之後馬上 speak()，Chrome 會靜靜地不發聲 → 隔一個 tick 再送
   2. 閒置久了語音引擎會被暫停 → 每次先 resume()
   另外送出後檢查有沒有真的在唸，沒有就不指定語音再試一次。 */
var SAY_Q=[], SAY_BUSY=false, SAY_FAIL=0;
function ssyn(){ return window.speechSynthesis || null; }
/* 學生用班級座號登入（例如 30301），語音會唸成「三萬零三百零一」。
   名字裡連續 3 位以上的數字要改成一個一個唸；1～2 位（座號 12 號）維持自然唸法。
   只改「唸出來的字串」，畫面上顯示的名字不變。 */
var SAY_DIGIT='零一二三四五六七八九';
function speakName(n){
  return String(n==null?'':n).replace(/[0-9]{3,}/g, function(m){
    return m.split('').map(function(d){ return SAY_DIGIT.charAt(+d); }).join('、');
  });
}
function say(text, queue, names){
  if(!SND || !text) return;
  if(names && names.length){
    names.forEach(function(n){
      /* 只換「第一次出現」的名字：名字都在句首，後面的數字是分數、關卡數，不能動 */
      if(!n || !/[0-9]{3,}/.test(n)) return;
      var i=text.indexOf(n);
      if(i>=0) text = text.slice(0,i) + speakName(n) + text.slice(i+n.length);
    });
  }
  var ss=ssyn(); if(!ss) return;
  if(!queue){
    SAY_Q.length=0; SAY_BUSY=false;
    try{ if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
  }
  SAY_Q.push(text);
  if(SAY_Q.length>3) SAY_Q.splice(0, SAY_Q.length-3);
  setTimeout(speakNext, 0);         /* 讓 cancel() 先結束，再開始唸 */
}
function utter(t, useVoice){
  var u=new SpeechSynthesisUtterance(t);
  u.lang='zh-TW'; u.rate=1.05; u.pitch=1.12; u.volume=1;
  if(useVoice){ var v=pickVoice(); if(v) u.voice=v; }
  u.onend=function(){ SAY_BUSY=false; SAY_FAIL=0; speakNext(); };
  u.onerror=function(){ SAY_BUSY=false; speakNext(); };
  return u;
}
function speakNext(){
  if(SAY_BUSY || !SAY_Q.length) return;
  var ss=ssyn(); if(!ss){ SAY_Q.length=0; return; }
  var t=SAY_Q.shift();
  SAY_BUSY=true;
  try{
    try{ ss.resume(); }catch(e){}
    ss.speak(utter(t,true));
    /* 送出後確認真的有在唸，沒有就不指定語音再送一次 */
    setTimeout(function(){
      try{
        if(SAY_BUSY && !ss.speaking && !ss.pending){
          SAY_FAIL++;
          ss.speak(utter(t,false));
        }
      }catch(e){}
    },300);
    /* 保險：8 秒還卡著就放行，免得整條佇列死掉 */
    setTimeout(function(){ if(SAY_BUSY){ SAY_BUSY=false; speakNext(); } },8000);
  }catch(e){ SAY_BUSY=false; }
}
/* 這台裝置到底能不能唸？給試聽鍵回報用 */
function voiceReport(){
  var ss=ssyn();
  if(!ss) return {ok:false, msg:'這個瀏覽器不支援語音播報（請改用 Chrome 或 Edge）'};
  var vs=[]; try{ vs=ss.getVoices()||[]; }catch(e){}
  var zh=vs.filter(function(v){ return /^zh/i.test(v.lang); });
  return { ok:true, total:vs.length, zh:zh.length,
           name: zh.length? zh[0].name : (vs.length? vs[0].name : '（沒有語音）'),
           speaking: !!(ss.speaking||ss.pending) };
}

/* 試聽：唸一段範例播報，上課前可以先確認喇叭和語音正常 */
var DEMO_LINES=[

];

function sayDemo(){

      + (r.speaking?'瀏覽器正在唸。<b>聽不到的話請調高喇叭音量</b>，或看看分頁有沒有被靜音。'
                   :'但瀏覽器沒有進入朗讀狀態，請改用 Chrome 或 Edge 開啟。'), r.speaking?'':'down');
  }, 1600);

/* 畫面上的播報條（沒有語音的裝置也看得到） */
function ticker(text, cls){
  var box=document.getElementById('rankTicker');
  if(!box) return;
  box.className='ticker '+(cls||'');
  box.innerHTML=(cls==='up'?'🚀 ':cls==='down'?'⚠️ ':'📣 ')+esc(text);
  box.style.display='';
}

/* 比對上一次的名次，找出這次的變動，並播報「誰、為什麼、變成第幾名」
   ------------------------------------------------------------------
   RANK_SNAP[uid] = { r:名次, g:總得分, d:完成關數, f:是否交卷 } */
function syncRanks(list, selfOnly){
  var sorted=list.slice().sort(rankSort), now={}, evts=[];
  RANK_DELTA={};
  sorted.forEach(function(r,i){
    now[r.uid]={ r:i+1, g:r.gained||0, d:r.done||0, f:r.fin?1:0 };
  });

  if(RANK_SNAP){
    var byOldRank={}, nameOf={};
    for(var u in RANK_SNAP) byOldRank[RANK_SNAP[u].r]=u;
    sorted.forEach(function(r){ nameOf[r.uid]=(r.uid===UID?'你':r.name); });

    sorted.forEach(function(r,i){
      var o=RANK_SNAP[r.uid], nn=i+1, me=(r.uid===UID), who=me?'你':r.name;
      if(!o){
        if(rankable(r)) evts.push({p:2, cls:'', t:who+'上榜了，排在第 '+nn+' 名', nm:[r.name]});
        return;
      }
      RANK_DELTA[r.uid]=o.r-nn;

      /* 這一次為什麼會動：加了幾分、破了第幾關、還是交卷了 */
      var dg=(r.gained||0)-o.g, dd=(r.done||0)-o.d, cause='';
      if(dg>0) cause = who+'加了 '+fmtPt(dg)+' 分';
      if(dd>0) cause = cause ? (cause+'、破了第 '+r.done+' 關')
                             : (who+'破了第 '+r.done+' 關');
      if(r.fin && !o.f) cause = who+'交卷了';

      if(nn<o.r && !cause){
        /* 自己沒加分，是別人掉下去（例如中途離開關卡）才往前：只顯示箭頭，不播報 */
      }else if(nn<o.r){
        var pu=byOldRank[nn], passed=(pu&&pu!==r.uid)?nameOf[pu]:'';
        var tail = (nn===1) ? (me?'衝上第一名了！':'衝上第一名！')
                 : passed   ? ('超過'+passed+'，'+(me?'衝上':'來到')+'第 '+nn+' 名')
                            : ('前進 '+(o.r-nn)+' 名，'+(me?'衝上':'來到')+'第 '+nn+' 名');
        evts.push({p: me?7:(nn===1?5:4), cls:'up', t:(cause? cause+'，':who)+tail, nm:[r.name, passed]});
      }else if(nn>o.r){
        /* 自己的分數變少（中途離開關卡）才掉名次，不用再說「誰超過你」 */
        if(me && (r.gained||0)>=o.g){
          var by='';
          for(var k=0;k<sorted.length;k++){
            var s2=sorted[k], os=RANK_SNAP[s2.uid];
            /* 新上榜（舊名單裡沒有）又排到你前面的人，也算是超過你的人 */
            if(s2.uid!==UID && (!os || os.r>o.r) && (k+1)<nn){ by=s2.name; break; }
          }
          var bg = by ? (function(){
            for(var m=0;m<sorted.length;m++){
              if(sorted[m].name===by){
                var d2=(sorted[m].gained||0)-(RANK_SNAP[sorted[m].uid]||{g:0}).g;
                return d2>0 ? (by+'加了 '+d2+' 分，超過你了') : (by+'超過你了');
              }
            }
            return by+'超過你了';
          })() : '你被超過了';
          evts.push({p:8, cls:'down', t: bg+'，你掉到第 '+nn+' 名', nm:[by]});
        }
      }else if(cause){
        /* 名次沒變，但分數動了也要說一聲，排行榜才不會無聲跳動 */
        evts.push({p: me?3:1, cls:'', t: cause+'，還是第 '+nn+' 名', nm:[r.name]});
      }
    });
  }
  RANK_SNAP=now;

  if(!evts.length) return false;
  evts.sort(function(a,b){ return b.p-a.p; });
  if(selfOnly) evts=evts.filter(function(e){ return e.t.indexOf('你')>=0; });
  if(!evts.length) return false;

  ticker(evts[0].t, evts[0].cls);
  for(var i=0;i<evts.length && i<3; i++) say(evts[i].t, i>0, evts[i].nm);
  if(evts[0].cls==='up' && evts[0].t.indexOf('你')===0) confetti();
  return true;
}

/* 追趕提示：離前一名還差多少（html 給畫面、speak 給語音） */
function chaseInfo(list){
  var sorted=list.slice().sort(rankSort), me=-1;
  for(var i=0;i<sorted.length;i++){ if(sorted[i].uid===UID){ me=i; break; } }
  if(me<0) return {html:'', speak:''};
  if(me===0){
    if(sorted.length<2) return {html:'', speak:''};
    var gap=fmtPt(sorted[0].gained-sorted[1].gained);
    return {
      html:'<div class="chase lead">👑 你是第 1 名，領先第 2 名 <b>'+gap+'</b> 分——別被追上了！</div>',
      speak:'你是第 1 名，領先第 2 名 '+gap+' 分，別被追上了。'
    };
  }
  var up=sorted[me-1], diff=up.gained-sorted[me].gained, diffT=fmtPt(diff);
  if(diff<=0) return {
    html:'<div class="chase">⚡ 你和第 '+(me)+' 名同分，<b>用時比較短就能超過</b>！</div>',
    speak:'你和第 '+me+' 名同分，用時比較短就能超過。'
  };
  return {
    html:'<div class="chase">🔥 再拿 <b>'+diffT+'</b> 分就能超過 '+esc(up.name)+'，衝上第 '+me+' 名！</div>',
    speak:'再拿 '+diffT+' 分就能超過 '+speakName(up.name)+'，衝上第 '+me+' 名。'
  };
}

function boardOff(){
  if(BOARD_OFF){ try{BOARD_OFF();}catch(e){} BOARD_OFF=null; }
  LAST_CHASE='';                 /* 下次打開排行榜會重新唸一次目前處境 */
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  SAY_Q.length=0; SAY_BUSY=false;
}
function encodeRec(r){ try{ return UNIT.codePrefix+btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }catch(e){ return ''; } }
function decodeRec(code){
  try{
    code=(code||'').trim().replace(new RegExp('^'+UNIT.codePrefix),'');
    var r=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(r&&r.uid&&typeof r.perf==='number') return r;
  }catch(e){}
  return null;
}
var BOARD_MSG=null, LAST_LIST=[], EXPORT_SORT='rank', EXPORT_TITLE='';
function seatNo(name){
  var t=String(name||''), m=t.match(/(\d+)\s*號/);
  if(m) return parseInt(m[1],10);
  var all=t.match(/\d+/g);
  if(all&&all.length) return parseInt(all[all.length-1],10);
  return 9999;
}

function renderBoard(){
  var live=(DBmode==='live'&&DB);
  /* quiet：連線版一打開先用本機資料墊著畫，那份名單不完整，不拿來比名次 */
  function paint(list, quiet){
    LAST_RAW=list.filter(function(r){ return sameUnit(r); });
    list=dedupeByName(list.filter(function(r){ return sameUnit(r)&&rankable(r); })).sort(rankSort);
    LAST_LIST=list;
    var spoke=quiet ? false : syncRanks(list,false);
    var ci=quiet ? {html:'',speak:''} : chaseInfo(list);
    if(!quiet && !list.some(function(r){ return r.uid===UID; }))
      ci.html='<div class="chase">🚩 你還沒開始玩，<b>進入第 1 關、按「開始挑戰」就會上榜</b>！</div>';
    var ch=document.getElementById('chaseBox');
    if(ch) ch.innerHTML=ci.html;
    /* 追趕提示只在內容變了才唸，免得每 6 秒重播一次 */
    if(ci.speak && ci.speak!==LAST_CHASE){
      LAST_CHASE=ci.speak;
      say(ci.speak, spoke);           /* 前面有播報就排在後面唸 */
    }
    var body=list.length?list.map(function(r,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1), me=r.uid===UID;
      var rp=(r.gained>0)?ptsByRank(i,list.length):null;
      /* 60 秒內還有上傳、又還沒交卷：這個人正在挑戰中 */
      var liveNow = !r.fin && (Date.now()-(r.ts||0) < 60000) && (r.done||0) < LEVELS.length;

    });

               : '<th>名次</th><th>座號</th><th>姓名</th><th>點數</th><th>平均表現</th><th>總用時</th><th>總得分</th><th>進度</th>')
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>'

/* 同一個帳號再次登入時，地圖上方的「上次 vs 這次」看板。
   兩邊分數都看得到，最後由學生自己按鍵決定要留哪一次。 */
function compareHTML(){
  if(!hasPrev()) return '';
  var old=prevSummary(), now=mySummary();
  var win = now.gained>old.gained || (now.gained===old.gained && now.done>=old.done && now.secs<old.secs);
  var same = now.gained===old.gained && now.done===old.done;
  return '<div class="cmpbox">'
    + '<div class="cmphead">🎒 歡迎回來，'+esc(S.name)+'！這是你的<b>新一次挑戰</b>，題目已經換了一組。</div>'
    + '<div class="cmprow">'
    +   '<div class="cmpcell'+(!win&&!same?' win':'')+'"><div class="cmplab">上一次</div>'
    +     '<div class="cmpnum">'+fmtPt(old.gained)+'</div><div class="cmpsub">分　·　'+old.done+' / '+LEVELS.length+' 關　·　'+fmt(old.secs)+'</div></div>'
    +   '<div class="cmpvs">vs</div>'
    +   '<div class="cmpcell'+(win?' win':'')+'"><div class="cmplab">這一次</div>'
    +     '<div class="cmpnum">'+fmtPt(now.gained)+'</div><div class="cmpsub">分　·　'+now.done+' / '+LEVELS.length+' 關　·　'+fmt(now.secs)+'</div></div>'
    + '</div>'
    + '<div class="cmpnote">'
    +   (now.done===0
        ? '先去闖關，闖完再決定要留哪一次。<b>還沒決定之前，排行榜用的是上次的成績</b>，不會掉下去。'
        : (win ? '👍 這次比上次好！可以按「用這次的成績」換上去。'
               : '這次還沒超過上次。<b>排行榜目前用的是比較高的那一次</b>，你可以繼續挑戰，或直接決定。'))
    + '</div>'
    + '<div class="cmpbtns">'
    +   '<button class="btn main" id="keepNew"'+(now.done===0?' disabled':'')+'>✅ 用這次的成績</button>'
    +   '<button class="btn ghost" id="keepOld">🛡 保留上次的成績</button>'
    + '</div>'
    + '<div class="cmpnote small">按下去就定案：之後再登入又是全新的一次挑戰。</div>'
    + '</div>';
}
function bindCompare(){
  var bn=document.getElementById('keepNew'), bo=document.getElementById('keepOld');
  if(bn) bn.onclick=function(){
    var now=mySummary(), old=prevSummary();
    if(now.gained<old.gained){
      if(!confirm('這次的 '+fmtPt(now.gained)+' 分比上次的 '+fmtPt(old.gained)+' 分低，\n換成這次的成績嗎？（上次的成績就不見了）')) return;
    }
    keepRun('new');
  };
  if(bo) bo.onclick=function(){ keepRun('old'); };
}

          + '這個帳號以目前的分數為準，'+(HUNDRED?'每一關':'四關')+'都已鎖住，不能再遊玩。'
          + '<div style="margin-top:8px;font-size:13.5px;color:#8b7a55">'

  bindCompare();
  Array.prototype.forEach.call(app.querySelectorAll('.lv'),function(el){

                 : LEVELS[i].wip ? '這一關還在製作中。'
                 : '要先完成 '+prev.id+' '+prev.name+' 才會解鎖這一關。');

      }

  });
  var rp=document.getElementById('report'); if(rp) rp.onclick=renderReport;

  var ul=document.getElementById('unlock'); if(ul) ul.onclick=openUnlock;
  var r=document.getElementById('reset');
  if(r) r.onclick=function(){ S.score=0;S.stars={};S.unlocked=1;S.records={}; save(); renderMap(); };

}

/* ===================== 關卡流程 ===================== */
function startLevel(li){
  if(S.finalized){ sWrong(); return; }
  if(LEVELS[li].wip){ sWrong(); return; }
  if(li>0 && !S.records[LEVELS[li-1].id]){ sWrong(); return; }
  clearTimer(); boardOff();
  var lv=LEVELS[li];
  G={ li:li, lv:lv, qi:0, tries:0, firstTry:0, wrongTotal:0, combo:0, bestCombo:0,
      codes:{}, gained:0, timeUp:false, sec:0, st:null, paused:false, stopped:false, frozen:false,
      sos:0, sosStep:0, ver:0 };
  /* ---------- 動態題目 ----------
     單元包的關卡寫了 gen(ver) 的話，題目就由它生成：
       ver ＝ 這個帳號**進來這一關第幾次**（第 1 次＝0＝版本 A，全班同一份，首戰才比得起來）
       每進來一次就換下一組；次數跟著帳號走（換電腦、換下一位同學再登入都接得回來）。 */
  if(typeof lv.gen==='function'){
    S.tries = S.tries || {};
    S.tries[lv.id] = (S.tries[lv.id]||0) + 1;
    G.ver = S.tries[lv.id] - 1;
    save();
    try{ lv.items=lv.gen(G.ver); }
    catch(e){ console.error('題目生成失敗，改用上一版題目', e); }
  }
  paintScore();
  /* 關卡導引：先用一個簡單的例子說明怎麼玩，按了「開始挑戰」才開始計時 */
  if(lv.demo) renderDemo();
  else runLevel();
}
/* 真正開始這一關（計時從這裡起算） */
function runLevel(){
  var lv=G.lv;
  if(!S.started){ S.started=true; save(); }
  pushScore();
  timeChip.style.display=''; tickPaint();
  timer=setInterval(function(){
    if(G.paused) return;
    G.sec++; tickPaint();
    if(lv.countdown){
      var left=lv.timeLimit-G.sec;
      if(left<=10&&left>0) sTick();
      if(G.sec>=lv.timeLimit){ G.timeUp=true; clearTimer(); finish(); }
    }
  },1000);
  renderQ();
}
/* ---------- 關卡導引畫面 ----------
   lv.demo = { intro:'一句話說明這一關在做什麼',
               steps:[ {t:'步驟標題', d:'說明（可含 HTML）'} , … ],
               example:'示範用的簡單例子（HTML）'，
               note:'操作提醒' }                                   */
function renderDemo(){
  var lv=G.lv, d=lv.demo;
  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'+verChip()

    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="demohead"><div class="demoemoji">'+(d.emoji||'📖')+'</div>'
    + '<h2>'+esc(lv.name)+'　怎麼玩</h2><p>'+d.intro+'</p></div>'
    + (d.example ? '<div class="demoex"><h4>🔎 先看一個例子</h4>'+d.example+'</div>' : '')
    + '<div class="demosteps">'+(d.steps||[]).map(function(x,i){
        return '<div class="dstep"><span class="dnum">'+(i+1)+'</span>'
             + '<div><b>'+x.t+'</b><div class="dsd">'+x.d+'</div></div></div>';

    + '<div class="actions" style="margin-top:18px">'

  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  document.getElementById('demoGo').onclick=function(){ sTap(); runLevel(); };
}
function tickPaint(){
  var lv=G.lv;
  if(lv.countdown){
    var left=lv.timeLimit-G.sec;
    timeChip.textContent='⏱ '+left;
    timeChip.className='chip'+(left<=20?' warn':'');
  }else{
    timeChip.textContent='⏱ '+fmt(G.sec);
    timeChip.className='chip'+(G.sec>lv.target?' over':'');
  }
}
function clearTimer(){ if(timer){clearInterval(timer);timer=null;} timeChip.style.display='none'; }

/* 版本標籤：只有「會換題」的關卡才顯示 */
function verLetter(n){ return String.fromCharCode(65 + (n%26)); }
function verChip(){
  if(!G || typeof G.lv.gen!=='function') return '';
  return '<span class="verchip" title="重玩一次就換一組新題目">版本 '+verLetter(G.ver)+'</span>';
}
function renderQ(){

  var sub = M.sub ? M.sub(it,lv) : '';
  var stage = M.stage(it,lv);

  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'+verChip()
    + '<span class="cnt">第 '+(G.qi+1)+' / '+lv.items.length+' 題</span><span class="spacer"></span>'
    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + (pet().lines ? '<div class="buddyrow"><div class="buddy talker" id="buddy">'+pet().f+'</div>'
                     + '<div class="bubble" id="bubble"></div></div>'
                   : '<div class="buddy" id="buddy">'+pet().f+'</div>')
    + '<div class="qtext">'+(M.title?M.title(it,lv):'')+'</div>'
    + '<div class="qsub">'+(HUNDRED?'<b class="qpt">本題 '+fmtPt(it.pt)+' 分</b>　'+sub:sub)+'</div>'
    + '<div class="hintbox">💡 '+lv.hint+'</div>'
    + '<div id="fb"></div>'
    + '<div class="stage" id="stage">'+(G.combo>=2?'<div class="combo">🔥 連續答對 ×'+G.combo+'</div>':'')+stage+'</div>'
    + '<div class="actions">'
    + (M.noCheck?'':'<button class="btn main" id="check">確定！</button>')
    + (sosList(it,lv).length?'<button class="btn ghost" id="sos">🆘 求救</button>':'')
    + '</div>'
    + '<div id="sosbox"></div>';
  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  var ck=document.getElementById('check');
  if(ck) ck.onclick=check;
  var sb=document.getElementById('sos');
  if(sb) sb.onclick=showSos;
  buddyTalk(G.qi===0?'hi':'ask');
  bindStage();

/* ---------- 求救：一層一層給提示，永遠不給最後答案 ----------
   提示來源：題目的 it.sos（陣列），或玩法模組的 M.sos(it,lv) 回傳陣列 */
function sosList(it,lv){
  var M=MODES[lv.mode];
  var l = (M && M.sos) ? M.sos(it,lv) : it.sos;
  return (l && l.length) ? l : [];
}
function showSos(){
  var lv=G.lv, it=lv.items[G.qi], list=sosList(it,lv);
  if(!list.length) return;
  if(G.sosStep>=list.length){ sTap(); return; }
  G.sosStep++; G.sos++;
  sPick(); buddyTalk('sos');
  var box=document.getElementById('sosbox');
  var M=MODES[lv.mode], lay=(M&&M.sosLayer)?M.sosLayer(it,lv):'';
  box.innerHTML = '<div class="sosbox"><h4>🆘 一起想一想'+(lay?'　<span class="soslay">'+lay+'</span>':'')+'（'+G.sosStep+' / '+list.length+'）</h4>'
    + list.slice(0,G.sosStep).map(function(t,i){
        return '<div class="sosline"><span class="sn">'+(i+1)+'</span><div>'+t+'</div></div>';
      }).join('')
    + (G.sosStep<list.length
        ? '<div class="sosmore">還是不會？再按一次「🆘 求救」看下一個提示。</div>'
        : '<div class="sosmore done">提示到這裡為止——最後一步要自己算出來喔！</div>')
    + '</div>';
  var b=document.getElementById('sos');
  if(b) b.textContent = G.sosStep<list.length ? '🆘 再給一個提示' : '🆘 提示給完了';
}
/* 多層的題目：做完一層、換下一層時呼叫，求救從頭開始給這一層的提示 */
function sosReset(){
  if(!G) return;
  G.sosStep=0;
  var box=document.getElementById('sosbox'); if(box) box.innerHTML='';
  var b=document.getElementById('sos'); if(b) b.textContent='🆘 求救';
}
function buddyReact(kind){
  var b=document.getElementById('buddy'); if(!b) return;
  var base=b.classList.contains('talker')?'buddy talker':'buddy';
  b.className=base; void b.offsetWidth; b.className=base+' '+kind;
  buddyTalk(kind==='happy'?'right':'wrong');
}
/* 會說話的夥伴：pet().lines = { hi, ask, right, wrong, sos }，每項是一串台詞，隨機挑一句 */
function buddyTalk(kind){
  var p=pet(), el=document.getElementById('bubble');
  if(!el || !p.lines || !p.lines[kind] || !p.lines[kind].length) return;
  var arr=p.lines[kind], t=arr[Math.floor(Math.random()*arr.length)];
  el.innerHTML='<b>'+esc(p.n)+'：</b>'+t;
  el.className='bubble'; void el.offsetWidth; el.className='bubble pop';
}

function bindStage(){
  var M=MODES[G.lv.mode];
  if(M && M.bind) M.bind();
}
function noteMis(code){
  G.codes[code]=(G.codes[code]||0)+1;
}

/* ---------- 選擇題的小處罰：扣分 + 罰停 1 秒 ---------- */

function isChoiceMode(){
  var M=MODES[G.lv.mode];
  if(!M) return false;
  return typeof M.choice==='function' ? !!M.choice() : !!M.choice;
}
function sPenalty(){ tone(300,.14,'square',.14); tone(200,.22,'square',.13,.13); }
function floatPen(txt){
  var r=scoreChip.getBoundingClientRect();
  var d=document.createElement('div');
  d.className='floatpen'; d.textContent=txt;
  d.style.left=(r.left+r.width/2-18)+'px';
  d.style.top=(r.top+4)+'px';
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1000);
}
/* hard=true：猜得到的題型（扣分＋停 10 秒）
   hard=false：動手操作型（不扣分，只停 3 秒，讓學生慢下來但不怕嘗試） */
function applyPenalty(hard){
  var ms = hard ? FREEZE_MS : SOFT_FREEZE_MS;
  if(hard && !HUNDRED){
    G.gained=Math.max(0,G.gained-PENALTY);
    S.score=Math.max(0,S.score-PENALTY);
    paintScore(); save(); pushScore();
    floatPen('−'+PENALTY);
    scoreChip.classList.add('hit');
    setTimeout(function(){ scoreChip.classList.remove('hit'); },620);
  }
  sPenalty();

  /* 罰停：選項與確定鍵鎖住
     記住是哪一局：罰停期間學生可能已經離開關卡（G 變成 null）或開了新的一關 */
  var g=G;
  g.frozen=true;
  var stage=document.getElementById('stage');
  var btn=document.getElementById('check');
  if(stage) stage.classList.add('frozen');
  if(btn) btn.disabled=true;
  var fb=document.querySelector('.fb');
  var bar=document.createElement('div');
  bar.className='freezebar'; bar.id='freezebar';
  var tail = hard ? '秒…利用這段時間把上面的提示看一次' : '秒…慢慢來，再檢查一次';
  bar.innerHTML='⏳ 罰停 <b>'+Math.round(ms/1000)+'</b> '+tail;
  if(fb) fb.appendChild(bar);
  var t0=Date.now();
  var iv=setInterval(function(){
    var rest=Math.max(0,Math.ceil((ms-(Date.now()-t0))/1000));
    var b=document.getElementById('freezebar');
    if(b) b.innerHTML='⏳ 罰停 <b>'+rest+'</b> '+tail;
  },200);
  setTimeout(function(){
    clearInterval(iv);
    g.frozen=false;
    if(G!==g) return;
    var st=document.getElementById('stage'); if(st) st.classList.remove('frozen');
    var bt=document.getElementById('check'); if(bt) bt.disabled=false;
    var b=document.getElementById('freezebar');
    if(b) b.outerHTML='<div class="freezebar done">✅ 可以再試一次了</div>';
    sTap();
  },ms);
}

/* ===================== 判題 ===================== */
function check(){
  if(G&&G.frozen) return;
  var lv=G.lv, it=lv.items[G.qi], M=MODES[lv.mode];
  G.tries++;
  var res = M.judge(it,lv) || {};
  /* halt：題目還沒作答完，不算一次嘗試，也不罰
     tone:'ok' 用在多步驟的關卡——這一步做對了，繼續下一步 */
  if(res.halt){
    var tone = res.tone==='ok' ? 'ok' : 'no';
    showFb(tone, res.msg||'還沒做完喔。');
    G.tries--;
    if(tone==='ok'){ sPick(); }
    else { sWrong(); flash('no'); }
    return;
  }
  if(res.ok) onRight(it); else onWrong(it, res.code||null);
}
function onRight(it){
  var lv=G.lv;
  G.combo++; if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  var base = G.tries===1?10:4;
  var bonus = (G.tries===1 && G.combo>=3) ? 3 : 0;
  if(HUNDRED){ base = G.tries===1 ? (it.pt||0) : (G.tries===2 ? (it.pt||0)/2 : 0); bonus = 0; }
  if(G.tries===1) G.firstTry++;
  G.gained+=base+bonus; S.score+=base+bonus; paintScore(); pushScore();
  buddyReact('happy'); flash('ok');
  if(G.combo>=3) sCombo(G.combo); else sRight();
  burstAt(document.getElementById('stage'),['#ffb020','#2fa46b','#fff','#3aa6e0'],40);

  var msg = G.tries===1?('✅ 答對了！＋'+base+' 分'):('✅ 這次對了！＋'+base+' 分');
  if(HUNDRED) msg = G.tries===1 ? ('✅ 答對了！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分）')
                : base>0 ? ('✅ 訂正成功！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分，訂正拿一半）')
                         : ('✅ 做對了！看過答案才做對，這題不加分（本題 '+fmtPt(it.pt)+' 分）');
  if(bonus) msg += '　🔥 連續答對 ×'+G.combo+' 追加 ＋'+bonus+' 分';
  var M=MODES[G.lv.mode];
  var extra = M.onRight ? M.onRight(it) : null;
  if(extra && extra.msg) msg += extra.msg;
  showFb('ok',msg);
  var chk=document.getElementById('check');
  if(chk) chk.disabled=true;
  /* after：模組要改畫面的副作用，等回饋和按鈕都處理完才跑 */
  if(extra && extra.after) extra.after();
  /* hold：模組自己接管接下來的流程（例如換鈔機要先動手驗證） */
  if(extra && extra.hold) return;
  nextButton();
}
/* 玩法模組接管流程時，可以自己叫出「下一題」 */
function nextButton(){
  var last=G.qi+1>=G.lv.items.length;
  var act=document.querySelector('.actions');
  if(!act) return;
  act.innerHTML='<button class="btn go" id="next">'+(last?'看結果 →':'下一題 →')+'</button>';
  var b=document.getElementById('next');
  b.onclick=function(){
    G.qi++; sTap();
    if(G.qi<G.lv.items.length) renderQ(); else { clearTimer(); finish(); }
  };
  b.focus();
}
function onWrong(it,code){
  G.combo=0; G.wrongTotal++;
  buddyReact('sad'); sWrong(); flash('no');
  var pen=isChoiceMode();
  var m='';
  if(HUNDRED) m += '<div class="penline'+(pen?'':' soft')+'">'+(pen?'⛔ <b>選錯了</b>':'⏳ <b>再試一次</b>')
             + '　·　'+(G.tries===1?'訂正後可以拿這題一半的分數':'這題已經沒有分數了，但還是要做對')
             + '　·　先停 <b>'+Math.round((pen?FREEZE_MS:SOFT_FREEZE_MS)/1000)+' 秒</b></div>';
  else if(pen) m += '<div class="penline">⛔ <b>選錯了</b>　扣 <b>'+PENALTY+' 分</b>　·　罰停 <b>'
             + Math.round(FREEZE_MS/1000)+' 秒</b></div>';
  else    m += '<div class="penline soft">⏳ <b>再試一次</b>　不扣分　·　先停 <b>'
             + Math.round(SOFT_FREEZE_MS/1000)+' 秒</b>，把下面的提示看一次</div>';
  if(code){ noteMis(code); m+='💡 '+MIS[code]+'<span class="code">'+code+'</span>'; }
  else m+='再想想看：'+G.lv.hint;
  var M=MODES[G.lv.mode];
  var ex = M.onWrong ? M.onWrong(it,code) : null;
  if(ex && ex.msg) m += ex.msg;
  if(!(ex && ex.hold) && G.tries>=2) m += '<div class="ans">'+answerText(it)+'</div>';
  showFb('no',m);
  if(ex && ex.after) ex.after();
  applyPenalty(pen);
}
function answerText(it){
  var M=MODES[G.lv.mode];
  return (M && M.answer) ? M.answer(it) : '';
}
function showFb(kind,html){
  document.getElementById('fb').innerHTML='<div class="fb '+kind+'">'+html+'</div>';
}

/* ===================== 停止鍵：先推算點數，再決定要不要停 ===================== */
function estimatePoints(provPerf){
  /* 沒玩過的關卡一律算 0 分——只玩一關不可能拿到滿點 */
  var sum=0, got=0;
  LEVELS.forEach(function(lv){
    if(G && lv.id===G.lv.id){ if(provPerf!=null){ sum+=provPerf; got++; } return; }
    var r=S.records[lv.id]; if(r){ sum+=r.perf; got++; }
  });
  if(!got) return null;
  var avg=sum/LEVELS.length;
  return { avg:avg, n:got, C:curvePoints(avg) };
}
/* 依排行榜推算：現在收手可以拿幾點 */
function rankEstHTML(est){
  var me=provisionalSummary();
  var R=myRankNow(me);
  if(HUNDRED) return '<div class="ptrow"><span>目前總分</span><b>'+fmtPt(me.gained)+' / 100 分</b></div>'

      + '<div class="ptrow"><span>完成關卡</span><b>'+me.done+' / '+LEVELS.length+' 關</b></div>'

/* ===================== 單關結算 ===================== */
function finish(){
  clearTimer();
  var lv=G.lv, total=lv.items.length;
  var P=levelPerf(G.firstTry,total,G.sec,lv.target,G.timeUp);
  var stars=P.perf>=NEED_3?3:P.perf>=NEED_2?2:1;
  if(HUNDRED){ var ratio=lvMax(lv)?G.gained/lvMax(lv):0; stars=ratio>=0.9?3:ratio>=0.7?2:1; }
  if(stars>(S.stars[lv.id]||0)) S.stars[lv.id]=stars;
  var old=S.records[lv.id];
  var plays=(old&&old.plays?old.plays:0)+1;
  var kept = !!old && !betterRun(G.gained,G.sec,old);
  if(!kept){
    S.records[lv.id]={sec:G.sec,gained:G.gained,firstTry:G.firstTry,total:total,
                      acc:P.acc,spd:P.spd,perf:P.perf,timeUp:G.timeUp,
                      stopped:!!G.stopped,done:G.qi,plays:plays,sos:G.sos||0};
  }else{
    old.plays=plays;
  }
  save(); paintScore(); pushScore(function(){ refreshClass(paintRank); });
  if(!G.timeUp&&!G.stopped){ sClear(); confetti(); if(stars===3) setTimeout(function(){sStar();confetti();},450); }
  else if(G.stopped) sMerge();
  else sWrong();

  var codes=Object.keys(G.codes).map(function(c){return [c,G.codes[c]];}).sort(function(a,b){return b[1]-a[1];});
  var remember = codes.length
    ? '<div class="remember"><h4>📌 這一關要特別記住</h4><ul>'
      + codes.map(function(p){return '<li>'+MIS[p[0]]+'<span class="code">'+p[0]+' ×'+p[1]+'</span></li>';}).join('')
      + '</ul></div>'
    : (G.wrongTotal
        ? '<div class="allgood">👍 '+(UNIT.slipText||'沒有踩到常見的迷思陷阱，錯的是操作上的小失誤。')+'</div>'
        : '<div class="allgood">🎉 全部一次做對，'+(UNIT.praiseText||'這一關的觀念很穩！')+'</div>');
  var allDone=LEVELS.every(function(l){return S.records[l.id];});

  app.innerHTML =
    '<div class="rhead"><div class="emoji">'+pet().f+(G.timeUp?'⏰':(stars===3?'🏆':stars===2?'🎖️':'💪'))+'</div>'
    + '<h2>'+(G.timeUp?'時間到！':(G.stopped?lv.id+' '+lv.name+'　提早結算':lv.id+' '+lv.name+' 完成'))+'</h2>'
    + '<div style="font-size:26px;letter-spacing:3px;color:#ffb020">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div></div>'
    + (kept?'<div class="chase">📌 這次 '+fmtPt(G.gained)+' 分，沒有超過之前的 <b>'+fmtPt(old.gained)+' 分</b>，保留之前比較好的成績。</div>':'')
    + '<div class="rstats">'
    + '<div class="stat"><b>'+fmt(G.sec)+'</b><span>⏱ 用時</span></div>'
    + '<div class="stat"><b>'+G.firstTry+'/'+total+'</b><span>一次就做對</span></div>'
    + (G.stopped?'<div class="stat"><b>'+G.qi+'/'+total+'</b><span>⏹ 做到第幾題</span></div>':'')
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(G.gained)+' / '+fmtPt(lvMax(lv))+'</b><span>⭐ 本關得分</span></div>'
               + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '') + '</div>'
               + '<div class="ptbox"><h4>⭐ 分數怎麼算的</h4>'
               + '<div class="ptrow"><span>'+(lv.items.every(function(x){ return x.pt===lv.items[0].pt; })
                   ? '每一題 '+fmtPt(lv.items[0].pt)+' 分，共 '+total+' 題'
                   : '每一題的配分不一樣（題目下方會寫「本題 幾分」）')+'</span><b>本關 '+fmtPt(lvMax(lv))+' 分</b></div>'
               + '<div class="ptrow"><span>一次做對 '+G.firstTry+'/'+total+' 題：拿滿分；訂正後做對：拿一半</span><b>'+fmtPt(G.gained)+' 分</b></div>'
               + '<div class="ptrow"><span>全部關卡加起來</span><b>滿分 100 分</b></div></div>'
    : '<div class="stat"><b>+'+G.gained+'</b><span>⭐ 本關得分</span></div>'
    + '<div class="stat"><b>×'+G.bestCombo+'</b><span>🔥 最長連擊</span></div>'
    + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '')
    + '<div class="stat pt"><b>'+pctText(P.perf)+'</b><span>🎁 本關表現</span></div></div>'
    + '<div class="ptbox"><h4>🎁 本關表現怎麼算的（正確度 × 速度倍率）</h4>'
    + '<div class="ptrow"><span>正確度：一次做對 '+G.firstTry+'/'+total+'</span><b>'+pctText(P.acc)+'</b></div>'
    + '<div class="ptrow"><span>速度倍率：用時 '+fmt(G.sec)+'（'+fmt(P.fast)+' 以內才是滿倍率）'
      +(G.timeUp?'（時間到）':'')+'</span><b>× '+pctText(P.mult)+'</b></div>'
    + '<div class="ptrow"><span>本關表現（四關平均後才換算點數）</span><b>'+pctText(P.perf)+'</b></div></div>')
    + remember
    + '<div class="actions" style="margin-top:20px">'
    + '<button class="btn ghost" id="again">重玩這一關</button>'
    + (allDone?'<button class="btn go" id="report">🏅 看'+UNIT.certName+' →</button><button class="btn ghost" id="map">回'+UNIT.home+'</button>'
              :'<button class="btn main" id="map">回'+UNIT.home+' →</button>')
    + '</div>';
  document.getElementById('again').onclick=function(){ startLevel(G.li); };
  document.getElementById('map').onclick=renderMap;
  var rp=document.getElementById('report'); if(rp) rp.onclick=renderReport;
}

var REPORT_SYNCED=false;
function renderReport(){

    REPORT_SYNCED=true;
    refreshClass(function(){ if(document.querySelector('.rank')) renderReport(); });
  }
  var secs=0,gained=0,ft=0,tot=0,done=0,perfSum=0;
  var rows=LEVELS.map(function(lv){
    var r=S.records[lv.id];
    if(!r) return '<tr><td class="nm">'+lv.id+' '+lv.name+'</td><td class="miss">—</td>'
      +'<td class="miss">—</td><td class="miss">—</td><td class="miss">未挑戰</td></tr>';
    done++; secs+=r.sec; gained+=r.gained; ft+=r.firstTry; tot+=r.total; perfSum+=r.perf;
    return '<tr><td class="nm">'+lv.id+' '+lv.name+'</td><td>'+fmt(r.sec)
      +(r.timeUp?' ⏰':'')+(r.stopped?' ⏹':'')+'</td>'
      +'<td>'+r.firstTry+'/'+r.total+'</td><td>'+(HUNDRED?fmtPt(r.gained)+' / '+fmtPt(lvMax(lv)):r.gained)+'</td>'
      +'<td class="pts">'+(HUNDRED?(lvMax(lv)?pctText(r.gained/lvMax(lv)):'—'):pctText(r.perf))+'</td></tr>';
  }).join('');
  var perfAll=perfSum/LEVELS.length, C=curvePoints(perfAll);
  var me=mySummary(), R=myRankNow(me);
  var finalPts=R.pts||C.pts;
  var rank=UNIT.ranks[Math.max(0,Math.min(2,finalPts-1))];

    + '<p style="color:#7b8b95;font-size:14.5px">'+UNIT.sub+'　·　'+(HUNDRED?'各關':'四關')+'全紀錄（每關取最好一次）</p></div>'
    + '<div class="tablewrap"><table class="sheet"><thead><tr>'
    + '<th>'+UNIT.levelWord+'</th><th>⏱ 用時</th><th>一次做對</th><th>⭐ 得分</th><th>'+(HUNDRED?'得分率':'🎁 表現')+'</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>'
    + '<div class="grand">'
    + '<div class="stat"><b>'+fmt(secs)+'</b><span>⏱ 總用時</span></div>'
    + '<div class="stat"><b>'+ft+'/'+tot+'</b><span>一次做對</span></div>'
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(gained)+' / 100</b><span>⭐ 總分</span></div></div>'
               + '<div class="rank"><div class="big">⭐ '+fmtPt(gained)+' 分</div><div class="ttl">'+rank+'</div>'
               + '<div class="sub">班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總分 '+fmtPt(me.gained)+' 分、總用時 '+fmt(me.secs)+'）。</div></div>'
    : '<div class="stat"><b>'+gained+'</b><span>⭐ 總得分</span></div>'
    + '<div class="stat pt"><b>'+pctText(perfAll)+'</b><span>🎁 平均表現</span></div></div>'
    + '<div class="rank"><div class="big">🎁 '+finalPts+' 點</div><div class="ttl">'+rank+'</div>'
    + '<div class="sub">'
    + (R.pts
        ? '班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總得分 '+me.gained+' 分、總用時 '+fmt(me.secs)+'）。<br>'
          + '前 1/3 給 3 點、中間 1/3 給 2 點、後 1/3 給 1 點。'
        : '班上人數不足 '+MIN_CLASS+' 人，改用絕對標準：四關平均表現 '+pctText(perfAll)
          + ' → 3 × '+perfAll.toFixed(2)+'<sup>'+CURVE_EXP+'</sup> ＝ '+C.raw.toFixed(2)+' → <b>'+C.pts+' 點</b>。')
    + '</div></div>')
    + '<div class="bonus">🏁 '+UNIT.nextTeaser+'</div>'
    + '<div class="actions" style="margin-top:20px">'
    + '<button class="btn go" id="board">🏆 看排行榜 →</button>'
    + '<button class="btn main" id="map">回'+UNIT.home+'</button></div>';
  document.getElementById('board').onclick=renderBoard;

/* ============================================================
   生成器工具（固定種子：同一個版本每次打開都一樣）
   ============================================================ */
function rngB(seed){
  var s=(seed*22695477+1)>>>0;
  return function(){ s=(s*22695477+1)>>>0; return (s>>>9)/8388608; };
}
function pickB(r,arr){ return arr[Math.floor(r()*arr.length)]; }
function intB(r,lo,hi){ return lo+Math.floor(r()*(hi-lo+1)); }
function shuffleB(r,arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 每一關固定出 4 種題型，順序隨版本換，但「四種都會出到」 */
function formPlan(r, forms, n){
  var out=[], bag=[];
  while(out.length<n){
    if(!bag.length) bag=shuffleB(r,forms);
    var f=bag.pop();
    if(out.length && out[out.length-1]===f && bag.length){ bag.unshift(f); f=bag.pop(); }
    out.push(f);
  }
  return out;
}

/* ============================================================
   L1 能量分配器（6-3 直式除法）
   題型：dial 自己選商｜mul 補乘積｜bug 抓出寫錯的那一格｜back 反推被除數
   ============================================================ */
function bugCard(a,b,kind){
  var q=Math.floor(a/b), r=a%b;
  if(kind==='q'){   /* 商寫太小：乘、減都「照著錯的商算」，所以餘數會比除數大 */
    var qq=q-1; return {cq:qq, cm:qq*b, cr:a-qq*b, bad:'q'};
  }
  if(kind==='m'){   /* 乘錯：商對，乘積多算或少算，餘數跟著跑掉 */
    var d=(a%2?1:2); var m=q*b+d; return {cq:q, cm:m, cr:a-m, bad:'m'};
  }
  return {cq:q, cm:q*b, cr:r+1, bad:'r'};   /* 餘數抄錯 */
}
function genDiv(ver){
  var base, forms;
  if(ver===0){
    base=[[9,4],[7,2],[36,7],[58,6],[46,7],[73,9]];          /* 課本 6-3 ⑴～⑹ */
    forms=['dial','dial','mul','bug','back','dial'];
  }else{
    var r=rngB(ver*131+7), used={}; base=[];
    while(base.length<6){
      var b=intB(r,2,9), q=intB(r,1,9), rr=intB(r,0,b-1), a=b*q+rr;
      if(a>99 || a<b || used[a+'/'+b]) continue;             /* 難度指紋：兩位數以內、商一位數 */
      used[a+'/'+b]=1; base.push([a,b]);
    }
    forms=formPlan(r,['dial','mul','bug','back'],6);
  }
  var r2=rngB(ver*977+3);
  return base.map(function(p,i){
    var a=p[0], b=p[1], q=Math.floor(a/b), rr=a%b, form=forms[i];
    var it={a:a,b:b,q:q,r:rr,form:form};
    if(form==='bug'){
      var kinds=['q','m','r'];
      var k=(q>1)?pickB(r2,kinds):pickB(r2,['m','r']);       /* 商是 1 的時候沒辦法「商寫太小」 */
      var c=bugCard(a,b,k); it.cq=c.cq; it.cm=c.cm; it.cr=c.cr; it.bad=c.bad;
    }
    if(form==='back'){
      /* 誘答：忘了加餘數（b×q）、多分一輪（a+b）、少分一輪（a−b）；
         剛好整除時 b×q 就等於正解，要換成別的誘答才不會兩個一樣 */
      var cand=[a, (rr>0? b*q : a-b), a+b, a-b, b*q+1];
      var o=[];
      cand.forEach(function(v){ if(v>0 && o.indexOf(v)<0 && o.length<3) o.push(v); });
      while(o.length<3){ var x=a+b*(o.length); if(o.indexOf(x)<0) o.push(x); }
      it.opts=shuffleB(r2,o);
      if(it.opts.indexOf(a)<0) it.opts[0]=a;
    }
    if(form==='mul'){
      var mo=[b*q, b*(q+1), b*q-b];
      it.mopts=shuffleB(r2,mo.filter(function(v,j,s2){ return v>=0 && s2.indexOf(v)===j; }));
      if(it.mopts.indexOf(b*q)<0) it.mopts[0]=b*q;
    }
    return it;
  });
}

/* ============================================================
   L2 規則晶片庫（6-4 0和1的除法）
   題型：chip 裝規則卡｜fill 填答案｜judge 能不能算｜find 找出答案是 X 的算式
   ============================================================ */
var CHIPS = [
  {k:'zero', t:'0 ÷ 任何數 ＝ 0',    why:'沒有東西可以分，每一份都是 0'},
  {k:'one',  t:'任何數 ÷ 1 ＝ 原來的數', why:'只分成 1 份，整份都是它'},
  {k:'self', t:'相同的兩數相除 ＝ 1', why:'幾個分成幾份，每份剛好 1 個'},
  {k:'bad',  t:'不能算（除數是 0）',  why:'不能分成 0 份'}
];
function chipAns(it){
  if(it.kind==='zero') return 0;
  if(it.kind==='one')  return it.a;
  if(it.kind==='self') return 1;
  return null;
}
function genChip(ver){
  var rows, forms;
  if(ver===0){
    rows=[{kind:'zero',a:0,b:3},{kind:'self',a:6,b:6},{kind:'one',a:7,b:1},
          {kind:'self',a:8,b:8},{kind:'one',a:4,b:1},{kind:'bad',a:5,b:0}];   /* 課本 6-4 ⑴⑵⑶⑷⑸ ＋ 除數 0 的陷阱 */
    forms=['chip','fill','judge','find','chip','judge'];
  }else{
    var r=rngB(ver*613+11), kinds=formPlan(r,['zero','one','self','bad'],6), used={};
    rows=kinds.map(function(k){
      var n, guard=0;
      do{ n=intB(r,2,9); guard++; }while(used[k+n] && guard<30);
      used[k+n]=1;
      if(k==='zero') return {kind:k,a:0,b:n};
      if(k==='one')  return {kind:k,a:n,b:1};
      if(k==='self') return {kind:k,a:n,b:n};
      return {kind:k,a:n,b:0};
    });
    forms=formPlan(r,['chip','fill','judge','find'],6);
  }
  /* 先把題型敲定（含除數 0 的改道與多樣性補救），再生選項，順序不能反 */
  forms=forms.slice();
  rows.forEach(function(it,i){
    /* 不能算的算式（除數 0）沒有答案可填，只能用「裝晶片」或「能不能算」 */
    if(it.kind==='bad' && (forms[i]==='fill'||forms[i]==='find')) forms[i]=(i%2?'chip':'judge');
    if(it.kind!=='bad' && forms[i]==='judge' && i%2===1) forms[i]='fill';
  });
  ['chip','fill','judge','find'].forEach(function(f){
    var have=function(){ var m={}; forms.forEach(function(x){ m[x]=1; }); return Object.keys(m); };
    if(have().length>=3 || have().indexOf(f)>=0) return;
    for(var i=0;i<rows.length;i++){
      if(rows[i].kind==='bad') continue;                       /* 不能算的題目不可以改成填答案／找算式 */
      if(forms.filter(function(x){ return x===forms[i]; }).length<2) continue;
      forms[i]=f; return;
    }
  });

  var r2=rngB(ver*409+5);
  return rows.map(function(it,i){
    it.form=forms[i];
    var ans=chipAns(it);
    if(it.form==='fill'){
      var o=[ans, it.kind==='one'?1:(it.a||it.b), it.kind==='self'?it.a:0];
      it.fopts=shuffleB(r2,o.filter(function(v,j,s2){ return v!==null && s2.indexOf(v)===j; }));
      while(it.fopts.length<3){ var x=intB(r2,2,9); if(it.fopts.indexOf(x)<0) it.fopts.push(x); }
      if(it.fopts.indexOf(ans)<0) it.fopts[0]=ans;
    }
    if(it.form==='find'){
      var n=it.a||it.b||5;
      var right = it.kind==='zero' ? [0,intB(r2,2,9)]
                : it.kind==='one'  ? [n,1]
                                   : [n,n];
      it.target = it.kind==='zero'?0:(it.kind==='one'?n:1);
      var val=function(p){ return p[1]===0?null:(p[0]===0?0:(p[1]===1?p[0]:(p[0]===p[1]?1:p[0]/p[1]))); };
      var pool=[[0,n],[n,1],[n,n],[intB(r2,2,9),1],[0,intB(r2,2,9)]];
      var wrongs=pool.filter(function(p){ return val(p)!==it.target; });
      var picked=[right];
      shuffleB(r2,wrongs).forEach(function(p){
        if(picked.length<3 && !picked.some(function(x){ return x[0]===p[0]&&x[1]===p[1]; })) picked.push(p);
      });
      var guard=2;
      while(picked.length<3){ var cand=[guard,1]; if(val(cand)!==it.target) picked.push(cand); guard++; }
      it.eqs=shuffleB(r2,picked);
    }
    return it;
  });
}

/* ============================================================
   L3 雙軌分流帶（6-5 偶數和奇數）
   題型：pair 兩兩配對｜sort 一排數字分流｜odd1 抓出放錯的｜make 填個位
   ============================================================ */
var BOOK65 = [
  [3,8,13,26,40,65,72,91,211,425,564,1053],
  [7,18,13,36,42,65,78,91,213,325,434,1057],
  [1,28,43,46,48,67,82,93,311,327,994,1051],
  [3,6,23,36,44,61,70,99,100,425,566,2057],
  [5,12,36,51,64,87,90,99,111,326,445,680],
  [3,12,36,57,64,89,90,97,113,326,443,680]
];
function isEven(n){ return n%2===0; }
function genPar(ver){
  var r=rngB(ver*743+17), items=[], forms;
  if(ver===0){
    forms=['pair','sort','make','odd1','sort','pair'];
  }else{
    forms=formPlan(r,['pair','sort','odd1','make'],6);
  }
  for(var i=0;i<6;i++){
    var f=forms[i], it={form:f};
    if(f==='pair'){
      it.n = (ver===0 && i===0) ? 13 : intB(r,7,19);               /* 看得完的數量，動手配對 */
      it.ans = isEven(it.n) ? 'even' : 'odd';
    }
    if(f==='sort'){
      var pool = (ver===0) ? BOOK65[i%BOOK65.length] : null;        /* 版本 A 用課本那幾排 */
      var nums;
      if(pool){ nums=shuffleB(r,pool).slice(0,6); }
      else{
        nums=[];
        while(nums.length<6){
          var d=[2,3,4][intB(r,0,2)];
          var v=intB(r, d===2?10:(d===3?100:1000), d===2?99:(d===3?999:9999));
          if(nums.indexOf(v)<0) nums.push(v);
        }
      }
      if(!nums.some(isEven)) nums[0]=nums[0]+1;
      if(!nums.some(function(x){ return !isEven(x); })) nums[1]=nums[1]+1;
      it.nums=nums;
    }
    if(f==='odd1'){
      var want = intB(r,0,1)===0 ? 'even' : 'odd';                  /* 這一軌應該放什麼 */
      var list=[];
      while(list.length<4){
        var v2=intB(r,10,999);
        if((want==='even')===isEven(v2) && list.indexOf(v2)<0) list.push(v2);
      }
      var badV;
      do{ badV=intB(r,10,999); }while((want==='even')===isEven(badV));
      if(ver===0 && !list.length) list=[26,40,72,564];
      var pos=intB(r,0,4);
      list.splice(pos,0,badV);
      it.want=want; it.nums=list; it.bad=pos;
    }
    if(f==='make'){
      var head=intB(r,1,9)*10 + (intB(r,0,1)===0?0:intB(r,0,9));    /* 兩位或三位的前半段 */
      it.head = intB(r,0,1)===0 ? String(intB(r,1,9)) : String(intB(r,10,99));
      it.want = intB(r,0,1)===0 ? 'even' : 'odd';
      var good=[], bad2=[];
      for(var d2=0;d2<=9;d2++){ ((it.want==='even')===isEven(d2) ? good : bad2).push(d2); }
      it.ans = pickB(r, it.want==='even' ? [0,2,4,6,8] : [1,3,5,7,9]);
      /* 想要奇數時一定放 0 進來當誘答：很多學生以為 0 不算偶數 */
      var o2=[it.ans, (it.want==='odd' ? 0 : pickB(r,bad2)), pickB(r,bad2)];
      it.opts = shuffleB(r, o2.filter(function(v,j,s2){ return s2.indexOf(v)===j; }));
      while(it.opts.length<3){ var c=pickB(r,bad2); if(it.opts.indexOf(c)<0) it.opts.push(c); }
      if(it.opts.indexOf(it.ans)<0) it.opts[0]=it.ans;
    }
    items.push(it);
  }
  return items;
}

/* ============================================================
   L4 總裝測試線（綜合，難度提升）
   每題三層：① 直式算商餘 ② 兩個條件各判斷一次 ③ 蓋章出貨或退回
   出貨條件：剛好分完（餘數 0）而且 每台拿到偶數個
   ============================================================ */
function genShip(ver){
  var base;
  if(ver===0){
    base=[[50,8],[16,4],[82,9],[36,6],[48,8],[73,9]];      /* 課本 6-3 ⑺⑻⑼ ＋ 剛好分完的兩題 ＋ 有餘數的一題 */
  }else{
    var r=rngB(ver*1097+23), used={}; base=[];
    /* 六題的條件組合固定：2 題可以出貨（整除＋商是偶數）、4 題要退回（各種原因都有） */
    var plan=[ {ex:1,ev:1}, {ex:1,ev:1}, {ex:1,ev:0}, {ex:0,ev:1}, {ex:0,ev:0}, {ex:0,ev:1} ];
    plan.forEach(function(want){
      var b,q,rr,a,guard=0;
      do{
        b=intB(r,3,9);
        q=intB(r,2,9); if(want.ev && q%2) q=q-1 || 2; if(!want.ev && q%2===0) q=q+1>9?3:q+1;
        rr=want.ex?0:intB(r,1,b-1);
        a=b*q+rr; guard++;
      }while((a>99 || used[a+'/'+b] || (q%2===0)!==!!want.ev || (rr===0)!==!!want.ex) && guard<200);
      used[a+'/'+b]=1; base.push([a,b]);
    });
    base=shuffleB(r,base);
  }
  return base.map(function(p){
    var a=p[0], b=p[1], q=Math.floor(a/b), r2=a%b;
    return {a:a, b:b, q:q, r:r2, exact:(r2===0), even:isEven(q), ship:(r2===0 && isEven(q))};
  });
}

/* ============================================================
   共用：分層看板（✔ 做完的那一層　▶ 現在這一層）
   樣式 .m6lay 在引擎裡，兩層以上的題目都用這個
   ============================================================ */
function m6layers(doneTxt, curTxt){
  return '<div class="m6lay">'+(doneTxt?'<div class="done">✔ '+doneTxt+'</div>':'')
       + '<div class="cur">▶ '+curTxt+'</div></div>';
}

/* ============================================================
   共用：直式畫面
   ============================================================ */
function longDiv(b, a, quo, mul, rem, hot){
  var cell=function(v,cls){ return '<span class="r6v '+(cls||'')+'">'+(v===null||v===undefined?'<i>?</i>':v)+'</span>'; };
  return '<div class="r6long">'
    + '<div class="r6lrow"><span class="r6lb"></span>'+cell(quo,'quo'+(hot==='q'?' hot':''))+'</div>'
    + '<div class="r6lrow bar"><span class="r6lb">'+b+'<b>)</b></span>'+cell(a,'dvd'+(hot==='a'?' hot':''))+'</div>'
    + '<div class="r6lrow"><span class="r6lb"></span>'+cell(mul,'mul'+(hot==='m'?' hot':''))+'</div>'
    + '<div class="r6lrow line"><span class="r6lb"></span>'+cell(rem,'rem'+(hot==='r'?' hot':''))+'</div>'
    + '</div>';
}
function btns(list, cls){
  return '<div class="popts">'+list.map(function(o){
    return '<button class="popt '+(cls||'')+'" data-v="'+o.v+'"'+(o.dis?' disabled':'')+'>'+o.t+'</button>';
  }).join('')+'</div>';
}
function bindV(fn){
  Array.prototype.forEach.call(document.querySelectorAll('#zone .popt[data-v]'),function(b){
    b.onclick=function(){ if(G.frozen||G.st.done) return; sPick(); fn(b.dataset.v, b); };
  });
}

/* ============================================================
   L1 能量分配器
   ============================================================ */
function stageDiv(it){
  G.st={ step:0, q:null, mul:null, r:null, done:false, act:null };
  var head = it.form==='bug'  ? '🔍 這台機器的直式<b>有一格寫錯了</b>，點出錯的那一格。'
           : it.form==='back' ? '🧩 直式被擦掉了一格，<b>原本有幾顆能量球？</b>'
           : it.form==='mul'  ? '⚙️ 商已經填好了，<b>機器要扣掉多少？</b>'
           : '🔋 有 '+it.a+' 顆能量球，平分給 <b>'+it.b+'</b> 台機器人。<b>每台最多拿幾顆？還剩幾顆？</b>';
  return '<div class="pq">'+head+'</div><div id="zone"></div>';
}
function paintDiv(){
  var it=G.lv.items[G.qi], st=G.st, h='';
  if(it.form==='dial'){
    h += m6layers(st.step>0?('第 ① 層：每台拿 '+st.q+' 顆，機器扣掉 '+(st.q*it.b)+' 顆'):'',
                  st.step===0?'第 ① 層：每台先拿幾顆？（商）':'第 ② 層：剩下幾顆？（餘數）');
    h += longDiv(it.b, it.a, st.q, st.step>0?st.q*it.b:null, st.step>1?st.r:null);
    if(st.step===0){
      var ds=[]; for(var i=1;i<=9;i++) ds.push({v:i,t:i});
      h += '<div class="r6task">選一個商：'+it.b+' × 幾 最接近 '+it.a+' 又不超過？</div>' + btns(ds,'dial');
    }else{
      var rs=[]; for(var j=0;j<it.b;j++) rs.push({v:j,t:j});
      h += '<div class="r6task">'+it.a+' − '+(st.q*it.b)+' ＝ ？（剩下的要比 '+it.b+' 小）</div>' + btns(rs,'dial');
    }
  }
  if(it.form==='mul'){
    h += m6layers(st.step>0?('第 ① 層：要扣掉 '+st.mul+' 顆'):'',
                  st.step===0?'第 ① 層：商 × 除數 ＝ 要扣掉多少？':'第 ② 層：剩下幾顆？（餘數）');
    h += longDiv(it.b, it.a, it.q, st.step>0?st.mul:null, st.step>1?st.r:null, st.step===0?'m':'r');
    if(st.step===0){
      h += '<div class="r6task">每台拿 '+it.q+' 顆，'+it.b+' 台一共拿走幾顆？</div>'
        + btns(it.mopts.map(function(v){ return {v:v,t:v}; }));
    }else{
      var rs2=[]; for(var k=0;k<it.b;k++) rs2.push({v:k,t:k});
      h += '<div class="r6task">'+it.a+' − '+st.mul+' ＝ ？</div>' + btns(rs2,'dial');
    }
  }
  if(it.form==='bug'){
    h += '<div class="r6task">三個格子裡<b>只有一格是錯的</b>，點它！</div>';
    h += '<div class="r6long pick">'
      + '<div class="r6lrow"><span class="r6lb"></span><button class="r6v quo pick" data-v="q">'+it.cq+'</button></div>'
      + '<div class="r6lrow bar"><span class="r6lb">'+it.b+'<b>)</b></span><span class="r6v dvd">'+it.a+'</span></div>'
      + '<div class="r6lrow"><span class="r6lb"></span><button class="r6v mul pick" data-v="m">'+it.cm+'</button></div>'
      + '<div class="r6lrow line"><span class="r6lb"></span><button class="r6v rem pick" data-v="r">'+it.cr+'</button></div>'
      + '</div>'
      + '<div class="r6legend">上面是<b>商</b>　中間是<b>商×除數</b>　下面是<b>餘數</b></div>';
  }
  if(it.form==='back'){
    h += '<div class="r6task">這台機器分完的紀錄如下，<b>原本有幾顆？</b></div>';
    h += longDiv(it.b, null, it.q, it.b*it.q, it.r, 'a');
    h += btns(it.opts.map(function(v){ return {v:v,t:v+' 顆'}; }),'big');
  }
  document.getElementById('zone').innerHTML=h;
  if(it.form==='bug'){
    Array.prototype.forEach.call(document.querySelectorAll('#zone .r6v.pick'),function(b){
      b.onclick=function(){ if(G.frozen||G.st.done) return; sPick(); G.st.act={type:'bug',v:b.dataset.v}; check(); };
    });
  }else{
    bindV(function(v){ G.st.act={type:it.form, v:+v}; check(); });
  }
}

/* ============================================================
   L2 規則晶片庫
   ============================================================ */
function stageChip(it){
  G.st={ step:0, chip:null, done:false, act:null };
  return '<div class="pq">💠 '+(it.form==='find' ? '哪一個算式的答案是 <b>'+it.target+'</b>？'
        : (it.kind==='bad'&&it.form==='judge' ? '檢查這個算式' : '處理這個算式'))+'</div><div id="zone"></div>';
}
function paintChip(){
  var it=G.lv.items[G.qi], st=G.st, h='';
  var eq=function(a,b){ return '<div class="r6eq">'+a+' ÷ '+b+' ＝ <i>?</i></div>'; };
  if(it.form==='chip'){
    h += eq(it.a,it.b) + '<div class="r6task">裝上正確的規則晶片</div>'
      + '<div class="r6chips">' + CHIPS.map(function(c){
          return '<button class="r6chip" data-v="'+c.k+'">'+c.t+'</button>';
        }).join('') + '</div>';
  }
  if(it.form==='fill'){
    h += eq(it.a,it.b) + '<div class="r6task">答案是多少？</div>'
      + btns(it.fopts.map(function(v){ return {v:v,t:v}; }),'big');
  }
  if(it.form==='judge'){
    h += m6layers(st.step>0?'第 ① 層：這個算式可以算':'',
                  st.step===0?'第 ① 層：這個算式算得出來嗎？':'第 ② 層：那答案是多少？');
    h += eq(it.a,it.b);
    if(st.step===0){
      h += btns([{v:'ok',t:'✅ 算得出來'},{v:'no',t:'⛔ 不能算'}],'big');
    }else{
      var ans=chipAns(it), o=[ans,0,1,it.a].filter(function(v,i,s2){ return s2.indexOf(v)===i; }).slice(0,3);
      h += btns(o.map(function(v){ return {v:v,t:v}; }),'big');
    }
  }
  if(it.form==='find'){
    h += '<div class="r6task">下面哪一個算式的答案是 <b>'+it.target+'</b>？</div>'
      + '<div class="popts">' + it.eqs.map(function(p){
          return '<button class="popt big" data-v="'+p[0]+'_'+p[1]+'">'+p[0]+' ÷ '+p[1]+'</button>';
        }).join('') + '</div>';
  }
  document.getElementById('zone').innerHTML=h;
  if(it.form==='chip'){
    Array.prototype.forEach.call(document.querySelectorAll('#zone .r6chip'),function(b){
      b.onclick=function(){ if(G.frozen||G.st.done) return; sPick(); G.st.act={type:'chip',v:b.dataset.v}; check(); };
    });
  }else{
    bindV(function(v){ G.st.act={type:it.form, v:v}; check(); });
  }
}

/* ============================================================
   L3 雙軌分流帶
   ============================================================ */
function stagePar(it){
  G.st={ pairs:0, placed:{}, done:false, act:null };
  var head = it.form==='pair' ? '🔩 有 <b>'+it.n+'</b> 個零件，兩個兩個配成一組看看。'
           : it.form==='sort' ? '🛤️ 把每一個編號送到對的軌道。'
           : it.form==='odd1' ? '🔍 這一條是<b>'+(it.want==='even'?'偶數':'奇數')+'軌</b>，有一個放錯了，點出來。'
           : '🔢 個位要填哪一個數字，才會變成<b>'+(it.want==='even'?'偶數':'奇數')+'</b>？';
  return '<div class="pq">'+head+'</div><div id="zone"></div>';
}
function paintPar(){
  var it=G.lv.items[G.qi], st=G.st, h='';
  if(it.form==='pair'){
    var left=it.n-st.pairs*2, pairs='';
    for(var i=0;i<st.pairs;i++) pairs+='<span class="r6pair">🔩🔩</span>';
    var dots=''; for(var j=0;j<left;j++) dots+='<span class="r6nut">🔩</span>';
    h += '<div class="r6pool"><div class="r6lab">還沒配對：<b>'+left+'</b> 個</div><div class="r6dots">'+dots+'</div></div>'
      + '<div class="r6pool"><div class="r6lab">配好的：<b>'+st.pairs+'</b> 對</div><div class="r6dots">'+(pairs||'<span class="r6empty">還沒配</span>')+'</div></div>'
      + '<div class="popts"><button class="popt" data-v="pair"'+(left<2?' disabled':'')+'>🔗 配一對</button>'
      + '<button class="popt" data-v="even"'+(left>=2?' disabled':'')+'>剛好配完 → 偶數</button>'
      + '<button class="popt" data-v="odd"'+(left>=2?' disabled':'')+'>有落單 → 奇數</button></div>';
  }
  if(it.form==='sort'){
    var rowE='', rowO='', pool='';
    it.nums.forEach(function(n,i2){
      var p=st.placed[i2];
      var chipHtml='<button class="r6num" data-v="'+i2+'"'+(p?' disabled':'')+'>'+n+'</button>';
      if(p==='even') rowE+='<span class="r6num set">'+n+'</span>';
      else if(p==='odd') rowO+='<span class="r6num set">'+n+'</span>';
      else pool+=chipHtml;
    });
    var sel=st.sel;
    h += '<div class="r6pool"><div class="r6lab">還沒分的編號（先點一個，再點軌道）</div>'
      +  '<div class="r6dots">'+(pool||'<span class="r6empty">全部分完了</span>')+'</div></div>'
      +  '<div class="r6rails">'
      +    '<button class="r6rail even" data-v="rail_even"><b>偶數軌</b><div class="r6rl">'+(rowE||'—')+'</div></button>'
      +    '<button class="r6rail odd" data-v="rail_odd"><b>奇數軌</b><div class="r6rl">'+(rowO||'—')+'</div></button>'
      +  '</div>'
      +  '<div class="r6legend">'+(sel!==undefined&&sel!==null?('選好了 <b>'+it.nums[sel]+'</b>，要送到哪一軌？'):'先點一個編號')+'</div>';
  }
  if(it.form==='odd1'){
    h += '<div class="r6rails one"><div class="r6rail '+(it.want==='even'?'even':'odd')+' flat"><b>'
      +  (it.want==='even'?'偶數軌':'奇數軌')+'</b><div class="r6rl">'
      +  it.nums.map(function(n,i3){ return '<button class="r6num" data-v="'+i3+'">'+n+'</button>'; }).join('')
      +  '</div></div></div>'
      +  '<div class="r6legend">記得看<b>個位</b>，不是看最前面那一位。</div>';
  }
  if(it.form==='make'){
    h += '<div class="r6make">'+it.head+'<span class="r6slot">?</span></div>'
      +  '<div class="r6task">個位填哪一個，才會是'+(it.want==='even'?'偶數':'奇數')+'？</div>'
      +  btns(it.opts.map(function(v){ return {v:v,t:v}; }),'big');
  }
  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .popt[data-v], #zone .r6num[data-v], #zone .r6rail[data-v]'),function(b){
    b.onclick=function(){ if(G.frozen||G.st.done) return; sPick(); G.st.act={type:it.form, v:b.dataset.v}; check(); };
  });
}

/* ============================================================
   L4 總裝測試線
   ============================================================ */
function stageShip(it){
  G.st={ step:0, q:null, r:null, c1:null, c2:null, done:false, act:null };
  return '<div class="pq">🏁 這一批有 <b>'+it.a+'</b> 顆零件，要平分給 <b>'+it.b+'</b> 台機器人。</div>'
       + '<div class="r6rule">📋 <b>出貨條件（兩個都要過）</b>　① 剛好分完（餘數 0）　② 每台拿到<b>偶數</b>個</div>'
       + '<div id="zone"></div>';
}
function paintShip(){
  var it=G.lv.items[G.qi], st=G.st, h='';
  var done1 = st.step>0 ? ('第 ① 層：'+it.a+' ÷ '+it.b+' ＝ '+st.q+' … '+st.r) : '';
  var done2 = st.step>2 ? (done1+'　｜　第 ② 層：'+(it.exact?'剛好分完 ✔':'沒有剛好分完 ✘')
                          +'、每台 '+it.q+' 個是'+(it.even?'偶數 ✔':'奇數 ✘')) : done1;
  var cur = st.step===0 ? '第 ① 層：先算出商和餘數'
          : st.step===1 ? '第 ② 層之一：有沒有剛好分完？'
          : st.step===2 ? '第 ② 層之二：每台拿到的是偶數還是奇數？'
                        : '第 ③ 層：蓋章出貨，還是退回？';
  h += m6layers(st.step>2?done2:done1, cur);
  h += longDiv(it.b, it.a, st.step>0?it.q:null, st.step>0?it.q*it.b:null, st.step>0?it.r:null);
  if(st.step===0){
    var cand=[[it.q,it.r],[it.q+1,it.r],[it.q,(it.r+1)%it.b]], seen={}, out=[];
    cand.forEach(function(c){ var k=c[0]+'-'+c[1]; if(!seen[k]){ seen[k]=1; out.push(c); } });
    var g=2; while(out.length<3){ var k2=(it.q+g)+'-'+it.r; if(!seen[k2]){ seen[k2]=1; out.push([it.q+g,it.r]); } g++; }
    h += '<div class="r6task">'+it.a+' ÷ '+it.b+' ＝ ？</div>'
      +  btns(out.map(function(c){ return {v:c[0]+'_'+c[1], t:c[0]+' … '+c[1]}; }),'big');
  }else if(st.step===1){
    h += '<div class="r6task">餘數是 '+it.r+'，有沒有剛好分完？</div>'
      +  btns([{v:'yes',t:'✔ 剛好分完'},{v:'no',t:'✘ 沒有分完'}],'big');
  }else if(st.step===2){
    h += '<div class="r6task">每台拿到 '+it.q+' 個，這是偶數還是奇數？</div>'
      +  btns([{v:'even',t:'偶數'},{v:'odd',t:'奇數'}],'big');
  }else{
    h += '<div class="r6task">兩個條件都看過了，這一批要？</div>'
      +  btns([{v:'ship',t:'✅ 蓋章出貨'},{v:'back',t:'↩ 退回重做'}],'big');
  }
  document.getElementById('zone').innerHTML=h;
  bindV(function(v){ G.st.act={type:'ship', v:v}; check(); });
}

           : '自己選商，機器幫你乘和減';
    },
    title: function(it){ return it.form==='back' ? '？ ÷ '+it.b+' ＝ '+it.q+' … '+it.r : it.a+' ÷ '+it.b+' ＝ ？'; },
    stage: stageDiv,
    bind: paintDiv,
    sosLayer: function(it){
      if(it.form==='bug'||it.form==='back') return '';
      return G.st.step===0 ? '第 ① 層' : '第 ② 層';
    },
    sos: function(it){
      if(it.form==='bug')
        return [ '一格一格檢查：<b>商 × 除數</b> 是不是等於中間那一格？',
                 '再看最下面：<b>被除數 − 中間那一格</b> 是不是等於餘數？',
                 '最後看餘數有沒有<b>比除數小</b>。比除數大，就表示上面的商寫太小了。' ];
      if(it.form==='back')
        return [ '直式是倒過來看的：中間那一格是<b>被拿走的數量</b>。',
                 '被拿走的 ＝ 商 × 除數，再<b>加上剩下的</b>，才是原本的數量。',
                 '例如 商 3、除數 5、餘 2：3×5＝15，15＋2＝17。' ];
      if(G.st && G.st.step>0)
        return [ '餘數 ＝ <b>被除數 − 剛剛扣掉的數</b>。',
                 '算完記得檢查：餘數一定要<b>比除數小</b>。',
                 '例如 17 扣掉 15，剩 2，2 比 5 小，就對了。' ];
      return [ '想「'+it.b+' × 幾」：答案要<b>最接近 '+it.a+'，但不可以超過</b>。',
               '用九九乘法一個一個試：'+it.b+'×1、'+it.b+'×2…超過就退回前一個。',
               '例如 17 ÷ 5：5×3＝15 可以，5×4＝20 超過了，所以商是 3。' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'點一個答案。'};
      if(a.type==='bug'){
        if(a.v===it.bad) return {ok:true};
        return {ok:false, code:(it.bad==='q'?'REM_BIG':(it.bad==='m'?'MUL_WRONG':'SUB_WRONG'))};
      }
      if(a.type==='back'){
        if(a.v===it.a) return {ok:true};
        return {ok:false, code:'BACK_REM'};
      }
      if(a.type==='dial'){
        if(st.step===0){
          if(a.v*it.b>it.a) return {ok:false, code:'Q_BIG'};
          if(it.a-a.v*it.b>=it.b) return {ok:false, code:'Q_SMALL'};
          st.q=a.v; st.step=1; paintDiv();
          return {halt:true, tone:'ok', msg:'✔ 第 ① 層完成：每台拿 '+a.v+' 顆，機器扣掉 '+(a.v*it.b)
                 +' 顆。　▶ 第 ② 層：剩下幾顆？'};
        }
        if(a.v!==it.r) return {ok:false, code:'SUB_WRONG'};
        st.r=a.v; st.step=2; return {ok:true};
      }
      if(a.type==='mul'){
        if(st.step===0){
          if(a.v!==it.b*it.q) return {ok:false, code:(a.v>it.a?'Q_BIG':'MUL_WRONG')};
          st.mul=a.v; st.step=1; paintDiv();
          return {halt:true, tone:'ok', msg:'✔ 第 ① 層完成：'+it.q+' × '+it.b+' ＝ '+a.v
                 +'，要扣掉這麼多。　▶ 第 ② 層：剩下幾顆？'};
        }
        if(a.v!==it.r) return {ok:false, code:'SUB_WRONG'};
        st.r=a.v; st.step=2; return {ok:true};
      }
      return {halt:true, msg:'點一個答案。'};
    },
    answer: function(it){
      if(it.form==='bug') return '正解：寫錯的是'+(it.bad==='q'?'商':(it.bad==='m'?'中間的乘積':'餘數'))
            +'那一格；正確的是 '+it.a+' ÷ '+it.b+' ＝ '+it.q+' … '+it.r;
      if(it.form==='back') return '正解：'+it.q+' × '+it.b+' ＋ '+it.r+' ＝ '+it.a+' 顆';
      return '正解：'+it.a+' ÷ '+it.b+' ＝ '+it.q+' … '+it.r;
    },
    onRight: function(it){
      G.st.done=true;
      var msg = it.form==='bug' ? '🔍 抓到了！'+(it.bad==='q'?'商':(it.bad==='m'?'乘積':'餘數'))
                  +'那一格寫錯，正確是 <b>'+it.q+' … '+it.r+'</b>。'
              : it.form==='back' ? '🧩 答對！'+it.q+' × '+it.b+' ＋ '+it.r+' ＝ <b>'+it.a+'</b> 顆。'
              : '⚙️ 完成！'+it.a+' ÷ '+it.b+' ＝ <b>'+it.q+' … '+it.r+'</b>（餘數 '+it.r+' 比除數 '+it.b+' 小 ✔）';
      return { msg:'<div class="ans">'+msg+'</div>', after: paintDiv };
    }
  },

  /* ---------------- L2 規則晶片庫 ---------------- */
  chip6: {
    choice: true,
    noCheck: true,
    sub: function(it){
      return it.form==='chip' ? '裝上正確的規則晶片'
           : it.form==='fill' ? '直接填答案'
           : it.form==='judge' ? '先看能不能算，再算答案'
           : '找出答案符合的算式';
    },
    title: function(it){ return it.form==='find' ? '答案是 '+it.target+' 的算式是哪一個？' : it.a+' ÷ '+it.b+' ＝ ？'; },
    stage: stageChip,
    bind: paintChip,
    sosLayer: function(it){ return it.form==='judge' ? (G.st.step===0?'第 ① 層':'第 ② 層') : ''; },
    sos: function(it){
      if(it.form==='find')
        return [ '一個一個檢查：<b>先看有沒有 0 當除數</b>，那個直接刪掉。',
                 '被除數是 0 → 答案 0；除數是 1 → 答案是原來的數；兩個數一樣 → 答案 1。',
                 '再比對哪一個算出來剛好是題目要的答案。' ];
      if(it.kind==='bad')
        return [ '先看<b>除號後面</b>那個數是什麼。',
                 '分東西的時候，可以分成 1 份、2 份…但是<b>沒辦法分成 0 份</b>。',
                 '0÷5 和 5÷0 不一樣：0 在前面是「沒有東西可以分」，可以算。' ];
      if(it.kind==='zero')
        return [ '被除數是 <b>0</b>，表示<b>一個東西都沒有</b>。',
                 '沒有東西可以分，不管分給幾個人，每個人都拿到一樣多。',
                 '例如 0 顆糖分給 4 個人，每個人拿到幾顆？' ];
      if(it.kind==='one')
        return [ '除數是 <b>1</b>，表示<b>只分成一份</b>。',
                 '只有一份的話，東西全部都在那一份裡面。',
                 '例如 6 顆糖只裝成 1 包，那一包有幾顆？' ];
      return [ '兩個數字<b>一模一樣</b>，表示有幾個就分成幾份。',
               '幾個東西分成一樣多的份數，每一份會有幾個？',
               '例如 5 顆糖分給 5 個人，每個人拿到幾顆？' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'點一個答案。'};
      var ans=chipAns(it);
      if(a.type==='chip'){
        if(a.v===it.kind) return {ok:true};
        if(it.kind==='bad'||a.v==='bad') return {ok:false, code:'ZERO_DIV'};
        if(it.kind==='zero'||a.v==='zero') return {ok:false, code:'ZERO_DIV'};
        return {ok:false, code:'ONE_SELF'};
      }
      if(a.type==='fill'){
        if(+a.v===ans) return {ok:true};
        if(it.kind==='self') return {ok:false, code:'SELF_SELF'};
        if(it.kind==='zero') return {ok:false, code:'ZERO_DIV'};
        return {ok:false, code:'ONE_SELF'};
      }
      if(a.type==='judge'){
        if(st.step===0){
          var canDo=(it.kind!=='bad');
          if((a.v==='ok')!==canDo) return {ok:false, code:'ZERO_DIV'};
          if(!canDo) return {ok:true};
          st.step=1; paintChip();
          return {halt:true, tone:'ok', msg:'✔ 第 ① 層完成：這個算式<b>可以算</b>。　▶ 第 ② 層：答案是多少？'};
        }
        if(+a.v===ans) return {ok:true};
        if(it.kind==='self') return {ok:false, code:'SELF_SELF'};
        return {ok:false, code:'ONE_SELF'};
      }
      if(a.type==='find'){
        var p=String(a.v).split('_'), x=+p[0], y=+p[1];
        var v = (y===0) ? null : (x===0?0:(y===1?x:(x===y?1:x/y)));
        if(v===it.target) return {ok:true};
        if(y===0) return {ok:false, code:'ZERO_DIV'};
        if(x===0||it.target===0) return {ok:false, code:'ZERO_DIV'};
        return {ok:false, code:'ONE_SELF'};
      }
      return {halt:true, msg:'點一個答案。'};
    },
    answer: function(it){
      if(it.form==='find'){
        var t=it.target;
        return '正解：答案是 '+t+' 的算式是 '+(t===0?'0 ÷ 幾':(t===1?'相同兩數相除':'幾 ÷ 1'))+' 那一個';
      }
      if(it.kind==='bad') return '正解：'+it.a+' ÷ 0 <b>不能算</b>（不能分成 0 份）';
      return '正解：'+it.a+' ÷ '+it.b+' ＝ '+chipAns(it);
    },
    onRight: function(it){
      G.st.done=true;
      var c=CHIPS.filter(function(x){ return x.k===it.kind; })[0];
      var line = it.kind==='bad'
        ? '⛔ 答對！'+it.a+' ÷ 0 <b>不能算</b>——'+c.why+'。'
        : '💠 答對！'+it.a+' ÷ '+it.b+' ＝ <b>'+chipAns(it)+'</b>（'+c.t+'：'+c.why+'）';
      return { msg:'<div class="ans">'+line+'</div>', after: paintChip };
    }
  },

  /* ---------------- L3 雙軌分流帶 ---------------- */
  par6: {
    choice: function(){ var it=G.lv.items[G.qi]; return it.form==='odd1'||it.form==='make'; },
    noCheck: true,
    sub: function(it){
      return it.form==='pair' ? '兩個兩個配對，看會不會落單'
           : it.form==='sort' ? '每個編號送到對的軌道'
           : it.form==='odd1' ? '找出放錯軌道的那一個'
           : '填個位數字';
    },
    title: function(it){
      return it.form==='pair' ? it.n+' 是偶數還是奇數？'
           : it.form==='sort' ? '把 6 個編號分到兩條軌道'
           : it.form==='odd1' ? '誰放錯了？'
           : it.head+'□ 要變成'+(it.want==='even'?'偶數':'奇數');
    },
    stage: stagePar,
    bind: paintPar,
    sos: function(it){
      if(it.form==='pair')
        return [ '一直按「配一對」，<b>配到不能再配為止</b>。',
                 '看最後有沒有<b>剩下一個</b>：剩下就是奇數，沒剩就是偶數。',
                 '例如 9 個可以配 4 對，還剩 1 個 → 奇數。' ];
      if(it.form==='sort')
        return [ '數字大的時候不用配對，<b>只要看個位數字</b>。',
                 '個位是 0、2、4、6、8 → 偶數軌；1、3、5、7、9 → 奇數軌。',
                 '例如 1053 不要看 1，要看最後那個 3 → 奇數軌。' ];
      if(it.form==='odd1')
        return [ '這一軌只能放'+(it.want==='even'?'偶數':'奇數')+'，一個一個看<b>個位</b>。',
                 '個位是 0、2、4、6、8 是偶數，其他是奇數。',
                 '找出那個「個位不符合」的，就是放錯的那一個。' ];
      return [ '要變'+(it.want==='even'?'偶數':'奇數')+'只跟<b>個位</b>有關，前面的數字不用管。',
               (it.want==='even'?'個位要是 0、2、4、6、8。':'個位要是 1、3、5、7、9。'),
               '例如 4□ 要變偶數，個位可以填 0、2、4、6、8 其中一個。' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'動手做做看。'};
      if(it.form==='pair'){
        if(a.v==='pair'){
          if(it.n-st.pairs*2<2) return {halt:true, msg:'不夠配一對了，看看有沒有落單。'};
          st.pairs++; paintPar();
          var left=it.n-st.pairs*2;
          return {halt:true, tone:'ok', msg:'✔ 配好 '+st.pairs+' 對，還剩 '+left+' 個。'};
        }
        if(it.n-st.pairs*2>=2) return {halt:true, msg:'還可以再配一對，先配完再判斷。'};
        if(a.v===it.ans) return {ok:true};
        return {ok:false, code:'PAIR_LEFT'};
      }
      if(it.form==='sort'){
        if(a.v.indexOf('rail_')===0){
          if(st.sel===undefined||st.sel===null) return {halt:true, msg:'先點一個編號，再點軌道。'};
          var want=a.v.slice(5), n=it.nums[st.sel];
          if((want==='even')!==isEven(n)){
            st.sel=null; paintPar();
            return {ok:false, code:(n%10===0 ? 'PAR_ZERO' : 'PAR_FIRST')};
          }
          st.placed[st.sel]=want; st.sel=null; paintPar();
          var leftN=it.nums.filter(function(x,i4){ return !st.placed[i4]; }).length;
          if(!leftN) return {ok:true};
          return {halt:true, tone:'ok', msg:'✔ 送對了，還有 '+leftN+' 個要分。'};
        }
        st.sel=+a.v; paintPar();
        return {halt:true, msg:'選好 '+it.nums[st.sel]+' 了，要送到哪一軌？'};
      }
      if(it.form==='odd1'){
        if(+a.v===it.bad) return {ok:true};
        return {ok:false, code:'PAR_FIRST'};
      }
      if(it.form==='make'){
        var d=+a.v;
        if((it.want==='even')===isEven(d)) return {ok:true};
        return {ok:false, code:(d===0?'PAR_ZERO':'PAR_FIRST')};
      }
      return {halt:true, msg:'動手做做看。'};
    },
    answer: function(it){
      if(it.form==='pair') return '正解：'+it.n+' 個可以配 '+Math.floor(it.n/2)+' 對'
            + (it.n%2?'，還剩 1 個 → 奇數':'，剛好配完 → 偶數');
      if(it.form==='sort') return '正解：看個位數字分流（0、2、4、6、8 是偶數）';
      if(it.form==='odd1') return '正解：放錯的是 '+it.nums[it.bad]+'（個位 '+(it.nums[it.bad]%10)+'）';
      return '正解：個位填 '+it.ans+' 這一類的數字就對了';
    },
    onRight: function(it){
      G.st.done=true;
      var line;
      if(it.form==='pair') line='🔩 答對！'+it.n+' 個配成 '+Math.floor(it.n/2)+' 對'
            + (it.n%2?'，<b>落單 1 個 → 奇數</b>':'，<b>剛好配完 → 偶數</b>');
      else if(it.form==='sort') line='🛤️ 全部分對了！偶數：'+it.nums.filter(isEven).join('、')
            + '　奇數：'+it.nums.filter(function(n){ return !isEven(n); }).join('、');
      else if(it.form==='odd1') line='🔍 抓到了！<b>'+it.nums[it.bad]+'</b> 的個位是 '+(it.nums[it.bad]%10)
            + '，不是'+(it.want==='even'?'偶數':'奇數')+'。';
      else line='🔢 答對！'+it.head+'<b>'+it.ans+'</b> 的個位是 '+it.ans+'，所以是'+(it.want==='even'?'偶數':'奇數')+'。';
      return { msg:'<div class="ans">'+line+'</div>', after: paintPar };
    }
  },

  /* ---------------- L4 總裝測試線 ---------------- */
  ship6: {
    choice: true,
    noCheck: true,
    sub: function(){ return '三層：算直式 → 兩個條件 → 蓋章或退回'; },
    title: function(it){ return it.a+' ÷ '+it.b+' ＝ ？　這一批能出貨嗎？'; },
    stage: stageShip,
    bind: paintShip,
    sosLayer: function(){ return G.st.step===0?'第 ① 層':(G.st.step<3?'第 ② 層':'第 ③ 層'); },
    sos: function(it){
      if(G.st.step===0)
        return [ '先想「'+it.b+' × 幾」最接近 '+it.a+' 又不超過。',
                 '算出商以後，被除數減掉乘積就是餘數，餘數要比 '+it.b+' 小。',
                 '例如 26÷4：4×6＝24，剩 2，所以是 6 … 2。' ];
      if(G.st.step===1)
        return [ '「剛好分完」的意思是<b>一個都沒有剩下</b>。',
                 '看餘數那一格：餘數是 0 才叫剛好分完。',
                 '餘數只要不是 0，就是沒有分完。' ];
      if(G.st.step===2)
        return [ '要看的是<b>商</b>（每台拿到幾個），不是被除數。',
                 '判斷偶數奇數只看<b>個位數字</b>：0、2、4、6、8 是偶數。',
                 '例如每台拿到 6 個，6 是偶數。' ];
      return [ '把剛剛兩個檢查結果擺在一起看。',
               '出貨要<b>兩個都打勾</b>；只要有一個打叉就要退回。',
               '例如「剛好分完 ✔、但每台拿 7 個是奇數 ✘」→ 退回。' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'點一個答案。'};
      if(st.step===0){
        var p=String(a.v).split('_'), qq=+p[0], rr=+p[1];
        if(qq!==it.q || rr!==it.r) return {ok:false, code:(rr>=it.b?'REM_BIG':(qq>it.q?'Q_BIG':'SUB_WRONG'))};
        st.q=qq; st.r=rr; st.step=1; paintShip();
        return {halt:true, tone:'ok', msg:'✔ 第 ① 層完成：'+it.a+' ÷ '+it.b+' ＝ '+qq+' … '+rr
               +'　▶ 第 ② 層：有沒有剛好分完？'};
      }
      if(st.step===1){
        if((a.v==='yes')!==it.exact) return {ok:false, code:'SHIP_RULE'};
        st.c1=it.exact; st.step=2; paintShip();
        return {halt:true, tone:'ok', msg:'✔ 第 ② 層之一完成：'+(it.exact?'剛好分完。':'沒有剛好分完（還剩 '+it.r+' 個）。')
               +'　▶ 接下來看每台拿到的是偶數還是奇數。'};
      }
      if(st.step===2){
        if((a.v==='even')!==it.even) return {ok:false, code:(it.q%10===0?'PAR_ZERO':'PAR_FIRST')};
        st.c2=it.even; st.step=3; paintShip();
        return {halt:true, tone:'ok', msg:'✔ 第 ② 層之二完成：每台 '+it.q+' 個是'+(it.even?'偶數':'奇數')
               +'。　▶ 第 ③ 層：兩個條件一起看，要出貨還是退回？'};
      }
      if((a.v==='ship')===it.ship) return {ok:true};
      return {ok:false, code:'SHIP_RULE'};
    },
    answer: function(it){
      return '正解：'+it.a+' ÷ '+it.b+' ＝ '+it.q+' … '+it.r+'；'
           + (it.exact?'剛好分完 ✔':'沒分完 ✘')+'、每台 '+it.q+' 個是'+(it.even?'偶數 ✔':'奇數 ✘')
           + ' → '+(it.ship?'出貨':'退回');
    },
    onRight: function(it){
      G.st.done=true;
      return { msg:'<div class="ans">🏁 三層都對！'+it.a+' ÷ '+it.b+' ＝ <b>'+it.q+' … '+it.r+'</b>，'
               + (it.exact?'剛好分完 ✔':'沒有剛好分完 ✘')+'、每台 '+it.q+' 個是'+(it.even?'偶數 ✔':'奇數 ✘')
               + ' → <b>'+(it.ship?'蓋章出貨':'退回重做')+'</b></div>', after: paintShip };
    }
  }
};

</script>
<script>GameEngine.start();</script>
</body>
